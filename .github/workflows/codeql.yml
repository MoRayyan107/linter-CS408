name: CodeQL

on:
  push:
    branches:
      - main
      - master
      - 'dev/**'
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Security scan (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            label: Java
            build-mode: manual
          - language: javascript-typescript
            label: JavaScript and TypeScript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compile under CodeQL so analysis includes Lombok-generated code.
      # Tests and formatting are already checked by the CI workflow.
      - name: Build Java for analysis
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dspotless.skip=true clean compile

      - name: Analyze and upload security findings
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
